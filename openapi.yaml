openapi: 3.0.3
info:
  title: aether
  description: Commerce API for provider sites
  license:
    name: ''
  version: 0.1.0
paths:
  /v1/sites/{site_id}:
    get:
      tags:
      - site
      summary: Public site settings a storefront needs.
      operationId: get_site
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      tags:
      - site
      summary: |-
        Turns commerce on for a site, or updates its settings. Owner only. The
        currency is fixed once the site has orders.
      operationId: put_site
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutSite'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearer: []
  /v1/sites/{site_id}/account:
    get:
      tags:
      - account
      summary: The signed-in account.
      operationId: me
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
    post:
      tags:
      - account
      summary: |-
        Creates an account and signs it in; a verification code is emailed.
        Orders placed as a guest with this email join the account once the
        email is verified.
      operationId: sign_up
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/sites/{site_id}/account/email-verification:
    post:
      tags:
      - account
      summary: |-
        Emails a new verification code. Always 202, so it reveals nothing about
        which emails have accounts.
      operationId: request_verification
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInput'
        required: true
      responses:
        '202': {}
  /v1/sites/{site_id}/account/email-verification/confirm:
    post:
      tags:
      - account
      operationId: confirm_verification
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCode'
        required: true
      responses:
        '204': {}
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/sites/{site_id}/account/password-reset:
    post:
      tags:
      - account
      summary: Emails a password reset code. Always 202.
      operationId: request_reset
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInput'
        required: true
      responses:
        '202': {}
  /v1/sites/{site_id}/account/password-reset/confirm:
    post:
      tags:
      - account
      summary: |-
        Sets a new password and ends every session. Receiving the code proves
        the email address too, so it is marked verified.
      operationId: confirm_reset
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReset'
        required: true
      responses:
        '204': {}
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/sites/{site_id}/account/sessions:
    post:
      tags:
      - account
      operationId: sign_in
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/sites/{site_id}/account/sessions/current:
    delete:
      tags:
      - account
      summary: Ends the session the request is signed in with.
      operationId: sign_out
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204': {}
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
  /v1/sites/{site_id}/admin/categories:
    get:
      tags:
      - catalog
      summary: Every category, as a flat list ordered for display; build the tree from `parent_id`.
      operationId: list_categories
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
      security:
      - bearer: []
    post:
      tags:
      - catalog
      operationId: create_category
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearer: []
  /v1/sites/{site_id}/admin/categories/{category_id}:
    put:
      tags:
      - catalog
      summary: Replaces a category's fields. A category cannot move under its own subtree.
      operationId: update_category
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: category_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearer: []
    delete:
      tags:
      - catalog
      summary: Deletes a category and its subcategories; products stay, unassigned.
      operationId: delete_category
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: category_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204': {}
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearer: []
  /v1/sites/{site_id}/admin/email-sender:
    get:
      tags:
      - email
      summary: The sending domain, with its status refreshed from the email provider while pending.
      operationId: get_sender
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sender'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearer: []
    put:
      tags:
      - email
      summary: |-
        Sets the sending domain (owner only) and registers it with the email provider. Changing
        the domain starts verification again.
      operationId: put_sender
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SenderInput'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sender'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearer: []
    delete:
      tags:
      - email
      summary: Removes the site's own domain; emails fall back to the provider's address.
      operationId: delete_sender
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204': {}
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearer: []
  /v1/sites/{site_id}/admin/inventory:
    get:
      tags:
      - inventory
      summary: Every stock-tracked variant.
      operationId: list_inventory
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockLevel'
      security:
      - bearer: []
  /v1/sites/{site_id}/admin/inventory/{variant_id}/adjustments:
    post:
      tags:
      - inventory
      summary: |-
        Changes a variant's on-hand stock. The first adjustment starts tracking
        stock for the variant; untracked variants are always purchasable.
      operationId: adjust
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: variant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Adjust'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockLevel'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearer: []
  /v1/sites/{site_id}/admin/media:
    post:
      tags:
      - catalog
      summary: Starts an image upload. Attach the returned `media_id` to products.
      operationId: create_upload
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUpload'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearer: []
  /v1/sites/{site_id}/admin/orders:
    get:
      tags:
      - orders
      summary: Orders, newest first.
      operationId: list_orders
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: payment_status
        in: query
        required: false
        schema:
          type: string
          nullable: true
      - name: fulfilment_status
        in: query
        required: false
        schema:
          type: string
          nullable: true
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          format: uuid
          nullable: true
      - name: limit
        in: query
        description: 1 to 100, default 50.
        required: false
        schema:
          type: integer
          format: int64
          nullable: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSummaryPage'
      security:
      - bearer: []
  /v1/sites/{site_id}/admin/orders/{order_id}:
    get:
      tags:
      - orders
      operationId: admin_get_order
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearer: []
  /v1/sites/{site_id}/admin/orders/{order_id}/cancel:
    post:
      tags:
      - orders
      summary: Cancels an unfulfilled, unpaid order and releases its held stock.
      operationId: cancel_order
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cancel'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearer: []
  /v1/sites/{site_id}/admin/orders/{order_id}/refunds:
    post:
      tags:
      - payments
      summary: Refunds part or all of a paid order through the payment provider.
      operationId: refund_order
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundInput'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearer: []
  /v1/sites/{site_id}/admin/orders/{order_id}/shipments:
    post:
      tags:
      - orders
      summary: Records a parcel (or a pickup handover) for some or all of an order.
      operationId: create_shipment
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShipment'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearer: []
  /v1/sites/{site_id}/admin/orders/{order_id}/shipments/{shipment_id}:
    patch:
      tags:
      - orders
      operationId: update_shipment
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: shipment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShipment'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearer: []
  /v1/sites/{site_id}/admin/payments:
    get:
      tags:
      - payments
      summary: The site's payment account, refreshed from the provider.
      operationId: account_status
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAccount'
      security:
      - bearer: []
  /v1/sites/{site_id}/admin/payments/onboarding:
    post:
      tags:
      - payments
      summary: |-
        Connects the site to the payment provider (owner only) and returns a link
        to the provider's onboarding. Call again to resume unfinished onboarding.
      operationId: start_onboarding
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Onboarding'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingLink'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearer: []
  /v1/sites/{site_id}/admin/products:
    get:
      tags:
      - catalog
      summary: Products of every status, newest first.
      operationId: admin_list_products
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/ProductStatus'
      - name: cursor
        in: query
        description: '`next_cursor` from the previous page.'
        required: false
        schema:
          type: string
          format: uuid
          nullable: true
      - name: limit
        in: query
        description: 1 to 100, default 50.
        required: false
        schema:
          type: integer
          format: int64
          nullable: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
      security:
      - bearer: []
    post:
      tags:
      - catalog
      summary: Creates a product with its variants, add-ons, categories and media.
      operationId: create_product
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProduct'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearer: []
  /v1/sites/{site_id}/admin/products/{product_id}:
    get:
      tags:
      - catalog
      operationId: admin_get_product
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: product_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearer: []
    patch:
      tags:
      - catalog
      summary: Updates product fields; variants and add-ons have their own endpoints.
      operationId: update_product
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: product_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProduct'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearer: []
  /v1/sites/{site_id}/admin/products/{product_id}/option-groups:
    put:
      tags:
      - catalog
      summary: Replaces the product's add-on option groups and their values.
      operationId: put_option_groups
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: product_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceOptionGroups'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearer: []
