                $ref: '#/components/schemas/Problem'
  /v1/sites/{site_id}/carts/current/merge:
    post:
      tags:
      - cart
      summary: |-
        After a guest signs in: moves the guest cart's lines (`X-Cart-Token`)
        into the shopper's cart, adding quantities on identical lines.
      operationId: merge_cart
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: x-cart-token
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearer: []
  /v1/sites/{site_id}/carts/current/quote:
    post:
      tags:
      - checkout
      summary: |-
        Discounts, shipping options and totals for the current cart and an
        address. Call again with `shipping_method_code` once one is picked.
      operationId: quote_cart
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: x-cart-token
        in: header
        required: false
        schema:
          type: string
          nullable: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/sites/{site_id}/categories:
    get:
      tags:
      - storefront
      summary: Active categories, flat; build the tree from `parent_id`.
      operationId: storefront_categories
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
  /v1/sites/{site_id}/checkout:
    post:
      tags:
      - checkout
      summary: |-
        Places an order for the current cart. Send a fresh `Idempotency-Key` per
        attempt; retrying with the same key returns the same order.
      operationId: checkout
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: x-cart-token
        in: header
        required: false
        schema:
          type: string
      - name: idempotency-key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Checkout'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Placed'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/sites/{site_id}/orders:
    get:
      tags:
      - orders
      summary: |-
        The signed-in shopper's orders, newest first (including guest orders
        placed with their email once it is verified).
      operationId: my_orders
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderSummary'
      security:
      - session: []
  /v1/sites/{site_id}/orders/{order_id}:
    get:
      tags:
      - orders
      summary: 'One order: the shopper''s own, or a guest''s with the order token from checkout.'
      operationId: get_order
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: x-order-token
        in: header
        required: false
        schema:
          type: string
          nullable: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/sites/{site_id}/orders/{order_id}/payment:
    post:
      tags:
      - payments
      summary: |-
        Starts (or resumes) paying an order. The order becomes paid when the
        provider confirms the payment.
      operationId: pay_order
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: x-order-token
        in: header
        required: false
        schema:
          type: string
          nullable: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/sites/{site_id}/products:
    get:
      tags:
      - storefront
      summary: Active products, newest first.
      operationId: list_products
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: category
        in: query
        description: Only products in the category with this slug.
        required: false
        schema:
          type: string
          nullable: true
      - name: q
        in: query
        description: Only products whose name or descriptions contain every word, ignoring case.
        required: false
        schema:
          type: string
          nullable: true
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          format: uuid
          nullable: true
      - name: limit
        in: query
        description: 1 to 100, default 50.
        required: false
        schema:
          type: integer
          format: int64
          nullable: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/sites/{site_id}/products/{slug}:
    get:
      tags:
      - storefront
      operationId: get_product
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    Account:
      type: object
      required:
      - id
      - email
      - email_verified
      properties:
        email:
          type: string
        email_verified:
          type: boolean
        id:
          type: string
          format: uuid
    AddItem:
      type: object
      required:
      - variant_id
      properties:
        option_value_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Chosen add-on option values.
        quantity:
          type: integer
          format: int32
        variant_id:
          type: string
          format: uuid
    Address:
      type: object
      required:
      - line1
      - country_code
      properties:
        city:
          type: string
          nullable: true
        company:
          type: string
          nullable: true
        country_code:
          type: string
          description: ISO 3166-1 alpha-2, e.g. AU.
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        line1:
          type: string
        line2:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
        state:
          type: string
          description: State or province code, e.g. NSW.
          nullable: true
    Adjust:
      type: object
      required:
      - quantity
      - kind
      properties:
        kind:
          $ref: '#/components/schemas/AdjustmentKind'
        note:
          type: string
          nullable: true
        quantity:
          type: integer
          format: int64
          description: Signed change to on-hand stock.
    AdjustmentKind:
      type: string
      enum:
      - receipt
      - adjustment
    AppliedDiscount:
      type: object
      required:
      - promotion_id
      - name
      - amount
      - free_shipping
      properties:
        amount:
          type: string
        coupon_code:
          type: string
          description: The coupon that unlocked it; absent for automatic promotions.
          nullable: true
        free_shipping:
          type: boolean
        name:
          type: string
        promotion_id:
          type: string
          format: uuid
    ApplyCoupon:
      type: object
      required:
      - code
      properties:
        code:
          type: string
    Cancel:
      type: object
      properties:
        reason:
          type: string
          nullable: true
    Cart:
      type: object
      required:
      - id
      - currency
      - items
      - subtotal
      - item_count
      - ready
      properties:
        coupon_code:
          type: string
          description: The coupon entered; the quote shows whether it applies.
          nullable: true
        currency:
          type: string
        id:
          type: string
          format: uuid
        item_count:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartLine'
        ready:
          type: boolean
          description: True when the cart has items and none has a problem.
        subtotal:
          type: string
          description: Sum of lines without a `problem`.
    CartLine:
      type: object
      required:
      - id
      - product_id
      - product_slug
      - product_name
      - variant_id
      - attributes
      - options
      - quantity
      - unit_price
      - line_total
      properties:
        attributes:
          type: object
        id:
          type: string
          format: uuid
        line_total:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/ChosenOption'
        problem:
          type: string
          description: Why this line cannot be bought as it stands (sold out, removed, ...).
          nullable: true
        product_id:
          type: string
          format: uuid
        product_name:
          type: string
        product_slug:
          type: string
        quantity:
          type: integer
          format: int32
        unit_price:
          type: string
        variant_id:
          type: string
          format: uuid
        variant_name:
          type: string
          nullable: true
    Category:
      type: object
      required:
      - id
      - slug
      - name
      - status
      - sort_order
      properties:
        description:
          type: string
          nullable: true
        id:
          type: string
          format: uuid
        name:
          type: string
        parent_id:
          type: string
          format: uuid
          nullable: true
        slug:
          type: string
        sort_order:
          type: integer
          format: int32
        status:
          type: string
    CategoryInput:
      type: object
      required:
      - slug
      - name
      properties:
        description:
          type: string
          nullable: true
        name:
          type: string
        parent_id:
          type: string
          format: uuid
          nullable: true
        slug:
          type: string
        sort_order:
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/CategoryStatus'
    CategoryRef:
      type: object
      required:
      - id
      - slug
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    CategoryStatus:
      type: string
      enum:
      - active
      - inactive
    Checkout:
      type: object
      properties:
        billing_address:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Address'
            description: Defaults to the shipping address.
        email:
          type: string
          description: Required for guests; defaults to a shopper's account email.
          nullable: true
        shipping_address:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Address'
        shipping_method_code:
          type: string
          description: Required when the site ships; one of the quote's `shipping_options`.
          nullable: true
    ChosenOption:
      type: object
      required:
      - group
      - value_id
      - label
      - price_extra
      properties:
        group:
          type: string
        label:
          type: string
        price_extra:
          type: string
        value_id:
          type: string
          format: uuid
    ConditionsInput:
      type: object
      properties:
        category_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Only products in these categories (empty = all).
        min_subtotal:
          type: string
          description: The eligible lines must add up to at least this.
          nullable: true
        product_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Only these products (empty = all).
    Coupon:
      type: object
      required:
      - id
      - code
      - usage_count
      - status
      properties:
        code:
          type: string
        customer_id:
          type: string
          format: uuid
          nullable: true
        id:
          type: string
          format: uuid
        max_uses:
          type: integer
          format: int32
          nullable: true
        status:
          type: string
        usage_count:
          type: integer
          format: int32
    CouponInput:
      type: object
      required:
      - code
      properties:
        code:
          type: string
        customer_id:
          type: string
          format: uuid
          description: Only this customer may use it.
          nullable: true
        max_uses:
          type: integer
          format: int32
          description: None = unlimited; 1 = single use.
          nullable: true
    CouponStatusInput:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: active or disabled
    CreateProduct:
      type: object
      required:
      - slug
      - name
      - price
      properties:
        attributes:
          type: object
        category_ids:
          type: array
          items:
            type: string
            format: uuid
        compare_at_price:
          type: string
          nullable: true
        cost_amount:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        media:
          type: array
          items:
            $ref: '#/components/schemas/MediaInput'
        name:
          type: string
        option_groups:
          type: array
          items:
            $ref: '#/components/schemas/OptionGroupInput'
        price:
          type: string
        short_description:
          type: string
          nullable: true
        slug:
          type: string
        status:
          $ref: '#/components/schemas/ProductStatus'
        tax_class_id:
          type: string
          format: uuid
          nullable: true
        variant_axes:
          type: array
          items:
            type: string
        variants:
          type: array
          items:
            $ref: '#/components/schemas/VariantInput'
          description: 'Omit for a product without variations: one default variant is created.'
    CreateShipment:
      type: object
      properties:
        carrier:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentItem'
          description: Omit to ship everything not yet shipped.
        service:
          type: string
          nullable: true
        tracking_number:
          type: string
          nullable: true
    CreateUpload:
      type: object
      required:
      - mime_type
      properties:
        alt:
          type: string
          nullable: true
        mime_type:
          type: string
          description: The file's type, e.g. image/jpeg.
    Credentials:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
        password:
          type: string
    DiscountInput:
      oneOf:
      - type: object
        description: '`percent`: 10 = 10% off the eligible lines.'
        required:
        - percent
        - type
        properties:
          percent:
            type: string
          type:
            type: string
            enum:
            - percent_off
      - type: object
        required:
        - amount
        - type
        properties:
          amount:
            type: string
          type:
            type: string
            enum:
            - amount_off
      - type: object
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - free_shipping
    DnsRecord:
      type: object
      description: A DNS record the merchant publishes to verify their domain.
      required:
      - type
      - name
      - value
      properties:
        name:
          type: string
        type:
          type: string
        value:
          type: string
    EmailCode:
      type: object
      required:
      - email
      - code
      properties:
        code:
          type: string
        email:
          type: string
    EmailInput:
      type: object
      required:
      - email
      properties:
        email:
          type: string
    MediaInput:
      type: object
      required:
      - media_id
      properties:
        media_id:
          type: string
          format: uuid
        role:
          type: string
    Method:
      type: object
      required:
      - id
      - code
      - name
      - kind
      - status
      properties:
        carrier:
          type: string
          nullable: true
        code:
          type: string
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/MethodKind'
        name:
          type: string
        status:
          type: string
        tax_class_id:
          type: string
          format: uuid
          description: None = shipping charges are not taxed.
          nullable: true
    MethodInput:
      type: object
      required:
      - code
      - name
      - kind
      properties:
        carrier:
          type: string
          nullable: true
        code:
          type: string
        kind:
          $ref: '#/components/schemas/MethodKind'
        name:
          type: string
        status:
          type: string
        tax_class_id:
          type: string
          format: uuid
          nullable: true
    MethodKind:
      type: string
      enum:
      - delivery
      - pickup
    NewCart:
      type: object
      required:
      - cart
      properties:
        cart:
          $ref: '#/components/schemas/Cart'
        cart_token:
          type: string
          description: 'Guests: send as `X-Cart-Token` on every cart request. Shown only once.'
          nullable: true
    Onboarding:
      type: object
      required:
      - return_url
      - refresh_url
      properties:
        refresh_url:
          type: string
          description: Where the provider sends the merchant if the link expires.
        return_url:
          type: string
          description: Where the provider sends the merchant when onboarding is done.
    OnboardingLink:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          description: Send the merchant here; it works once and expires within minutes.
    OptionGroup:
      type: object
      required:
      - id
      - code
      - name
      - min_select
      - values
      properties:
        code:
          type: string
        id:
          type: string
          format: uuid
        max_select:
          type: integer
          format: int32
          description: None = no limit; 1 = single choice.
          nullable: true
        min_select:
          type: integer
          format: int32
          description: 1 or more makes the group required.
        name:
          type: string
        values:
          type: array
          items:
            $ref: '#/components/schemas/OptionValue'
    OptionGroupInput:
      type: object
      required:
      - code
      - name
      - values
      properties:
        code:
          type: string
        id:
          type: string
          format: uuid
          nullable: true
        max_select:
          type: integer
          format: int32
          nullable: true
        min_select:
          type: integer
          format: int32
        name:
          type: string
        values:
          type: array
          items:
            $ref: '#/components/schemas/OptionValueInput'
    OptionValue:
      type: object
      required:
      - id
      - code
      - label
      - price_extra
      - is_default
      properties:
        code:
          type: string
        id:
          type: string
          format: uuid
        is_default:
          type: boolean
        label:
          type: string
        price_extra:
          type: string
          description: Added to the line price when chosen; may be negative.
    OptionValueInput:
      type: object
      required:
      - code
      - label
      properties:
        code:
          type: string
        id:
          type: string
          format: uuid
          nullable: true
        is_default:
          type: boolean
        label:
          type: string
        price_extra:
          type: string
    Order:
      type: object
      required:
      - id
      - order_number
      - email
      - currency
      - payment_status
      - fulfilment_status
      - items
      - subtotal
      - discount_total
      - shipping_total
      - shipping_tax
      - tax_total
      - grand_total
      - refunded_total
      - prices_include_tax
      - shipments
      properties:
        billing_address:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Address'
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        currency:
          type: string
        customer_id:
          type: string
          format: uuid
          description: 'Admin only: the customer profile, e.g. to target a coupon.'
          nullable: true
        discount_total:
          type: string
        email:
          type: string
        fulfilment_status:
          type: string
        grand_total:
          type: string
        history:
          type: array
          items:
            $ref: '#/components/schemas/StatusChange'
          description: Admin only.
          nullable: true
        id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        order_number:
          type: integer
          format: int64
        payment_status:
          type: string
        placed_at:
          type: string
          format: date-time
          nullable: true
        prices_include_tax:
          type: boolean
          description: Prices (and the grand total) include `tax_total`.
        refunded_total:
          type: string
        shipments:
          type: array
          items:
            $ref: '#/components/schemas/Shipment'
        shipping_address:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Address'
        shipping_method_code:
          type: string
          nullable: true
        shipping_tax:
          type: string
        shipping_total:
          type: string
        subtotal:
          type: string
        tax_total:
          type: string
          description: Line tax plus shipping tax.
    OrderItem:
      type: object
      required:
      - id
      - product_name
      - options
      - quantity
      - unit_price
      - discount_total
      - tax_total
      - total
      - shipped_quantity
      - refunded_quantity
      properties:
        discount_total:
          type: string
        id:
          type: string
          format: uuid
        options:
          type: array
          items:
            type: object
          description: 'Chosen add-ons as bought: group, label, price_extra.'
        product_id:
          type: string
          format: uuid
          nullable: true
        product_name:
          type: string
        quantity:
          type: integer
          format: int32
        refunded_quantity:
          type: integer
          format: int32
        shipped_quantity:
