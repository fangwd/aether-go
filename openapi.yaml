        conditions:
          $ref: '#/components/schemas/ConditionsInput'
        discount:
          $ref: '#/components/schemas/DiscountInput'
        ends_at:
          type: string
          format: date-time
          nullable: true
        id:
          type: string
          format: uuid
        name:
          type: string
        per_customer_limit:
          type: integer
          format: int32
          nullable: true
        starts_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
        usage_count:
          type: integer
          format: int64
        usage_limit:
          type: integer
          format: int64
