          type: string
          nullable: true
        dimension_unit:
          type: string
          nullable: true
        height:
          type: string
          nullable: true
        id:
          type: string
          format: uuid
          nullable: true
        length:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        price_extra:
          type: string
        sku:
          type: string
          nullable: true
        status:
