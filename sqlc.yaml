version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/db/queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: { import: "github.com/google/uuid", type: "UUID" }
          - db_type: "uuid"
            nullable: true
            go_type: { import: "github.com/google/uuid", type: "UUID", pointer: true }
          - db_type: "pg_catalog.numeric"
            go_type: { import: "github.com/shopspring/decimal", type: "Decimal" }
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type: { import: "github.com/shopspring/decimal", type: "Decimal", pointer: true }
          - db_type: "pg_catalog.timestamptz"
            go_type: { import: "time", type: "Time" }
          - db_type: "timestamptz"
            go_type: { import: "time", type: "Time" }
          - db_type: "timestamptz"
            nullable: true
            go_type: { import: "time", type: "Time", pointer: true }
          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type: { import: "time", type: "Time", pointer: true }
          - db_type: "citext"
            go_type: "string"
          - db_type: "citext"
            nullable: true
            go_type: { type: "string", pointer: true }
          - db_type: "pg_catalog.bpchar"
            go_type: "string"
          - db_type: "pg_catalog.bpchar"
            nullable: true
            go_type: { type: "string", pointer: true }
          - db_type: "jsonb"
            go_type: { import: "encoding/json", type: "RawMessage" }
